[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "terminalui"
version = "0.1.0"
description = "A lightweight terminal UI framework made to be simple and fast"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name="Reese-WP"}
]


[tool.setuptools.packages.find]
where = ["src"]
